[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "py_magic"
# X.Y comes from the bundled libmagic's configure.ac; see setup.py.
dynamic = ["version"]
description = "libmagic bindings with a statically linked, version-pinned libmagic and bundled database."
readme = "README.md"
license = "BSD-2-Clause"
license-files = ["LICENSE", "LICENSE-libmagic"]
authors = [{ name = "Campbell Starky" }]
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: C",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: System :: Filesystems",
]

[project.optional-dependencies]
test = ["pytest"]
