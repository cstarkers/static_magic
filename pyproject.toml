[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "py_magic"
# X.Y comes from the bundled libmagic's configure.ac; see setup.py.
dynamic = ["version"]
description = "libmagic bindings with a statically linked, version-pinned libmagic and bundled database."
readme = "README.md"
license = "BSD-2-Clause"
license-files = ["LICENSE", "LICENSE-libmagic"]
authors = [{ name = "Campbell Starky" }]
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: C",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: System :: Filesystems",
]

[project.urls]
Homepage = "https://github.com/cstarkers/py_magic"
Source = "https://github.com/cstarkers/py_magic"
Issues = "https://github.com/cstarkers/py_magic/issues"

[project.optional-dependencies]
test = ["pytest"]

[tool.cibuildwheel]
build = "cp312-* cp313-* cp314-* cp314t-*"
skip = "*-musllinux_*"
test-requires = ["pytest"]
# Copy only the tests into a scratch directory, so they run against the
# installed wheel rather than the source tree.
test-sources = ["tests"]
test-command = "python -m pytest -p no:cacheprovider"

[tool.cibuildwheel.macos]
archs = ["arm64"]
environment = { MACOSX_DEPLOYMENT_TARGET = "11.0" }
